apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-tracker-frontend
  template:
    metadata:
      labels:
        app: expense-tracker-frontend
    spec:
      containers:
        - name: frontend
          image: expense-tracker-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: expense-tracker-frontend
spec:
  type: NodePort
  selector:
    app: expense-tracker-frontend
  ports:
    - port: 80
      targetPort: 80