name: Expense Tracker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: expense_tracker
          MYSQL_USER: expense_app
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Load database schema
        run: |
          mysql -h 127.0.0.1 \
            -uroot \
            -prootpassword \
            < sql/schema.sql

      - name: Build and test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/expense_tracker
          DB_USERNAME: expense_app
          DB_PASSWORD: testpassword
        run: mvn --batch-mode verify